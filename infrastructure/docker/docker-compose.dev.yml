version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradevision-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tradevision_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradevision-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
